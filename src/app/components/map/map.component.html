<div class="map-wrapper">
  <!-- Map Canvas Container -->
  <div #mapContainer class="map-container"></div>

  <!-- Mobile-First Header Overlay Badge -->
  <header class="project-header-overlay">
    <div class="header-card">
      <div class="brand-chip">
        <span class="pulse-dot"></span>
        <span class="brand-text">{{ mapService.is3DMode() ? '3D PERSPECTIVE' : 'LIVE MAP' }}</span>
      </div>
      <div class="header-title-group">
        <h1 class="project-title">Property Visualization Platform</h1>
        <div class="location-badge">
          <svg class="icon-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
            <circle cx="12" cy="10" r="3"></circle>
          </svg>
          <span class="coords-label">Lat: <strong>15.1267357</strong>, Lng: <strong>76.901774</strong></span>
        </div>
      </div>
    </div>
  </header>

  <!-- Mobile-First Touch Action Controls (Min 48px Touch Targets) -->
  <div class="touch-controls-group">
    <!-- 2D / 3D Mode Toggle Button -->
    <button
      type="button"
      class="touch-btn touch-btn-mode"
      [class.active-3d]="mapService.is3DMode()"
      aria-label="Toggle 2D or 3D Camera Perspective"
      title="Toggle 2D / 3D View"
      (click)="onToggle3D()"
    >
      <span class="mode-label">{{ mapService.is3DMode() ? '2D' : '3D' }}</span>
    </button>

    <button
      type="button"
      class="touch-btn"
      aria-label="Zoom In"
      (click)="onZoomIn()"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    </button>

    <button
      type="button"
      class="touch-btn"
      aria-label="Zoom Out"
      (click)="onZoomOut()"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    </button>

    <button
      type="button"
      class="touch-btn touch-btn-primary"
      aria-label="Recenter Map to Project Location"
      title="Recenter Map"
      (click)="onRecenter()"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="2" x2="12" y2="6"></line>
        <line x1="12" y1="18" x2="12" y2="22"></line>
        <line x1="2" y1="12" x2="6" y2="12"></line>
        <line x1="18" y1="12" x2="22" y2="12"></line>
      </svg>
    </button>
  </div>
</div>
